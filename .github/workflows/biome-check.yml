name: Biome Check

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  biome:
    name: Biome Lint & Format
    if: github.repository != 'tmfg/digitraffic-common'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          # Read the version from the lockfile so CI matches the local install
          # instead of drifting with "latest".
          working-dir: .
      - name: Run Biome
        run: biome ci --reporter=github --reporter=summary --error-on-warnings --no-errors-on-unmatched .

      # The reporters above only reach the log, so the summary is written separately.
      - name: Write job summary
        if: always()
        run: |
          {
            echo '## Biome'
            echo ''
            echo '```'
            biome ci --reporter=summary --error-on-warnings --no-errors-on-unmatched . 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
